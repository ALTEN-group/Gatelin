name: ${APP_NAME}

x-service-healthcheck: &healthcheck
  # /gatelin/health/ready also proves the database is reachable; /gatelin/health
  # only reports uptime and would keep a DB-less Gatelin instance in the load-balancer pool.
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/gatelin/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 5

services:

  postgres:
    platform: linux/amd64
    build:
      context: ${PWD}/db/pgsql
      dockerfile: dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGRES_DBS}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PWD}
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      GATELIN_USER: ${GATELIN_DB_USER}
      GATELIN_PWD: ${GATELIN_DB_PWD}
      FOXNOX_USER: ${FOXNOX_DB_USER}
      FOXNOX_PWD: ${FOXNOX_DB_PWD}
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "${GATELIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: ${TRAEFIK_HOST}
    hostname: ${TRAEFIK_HOST}
    command:
      - --providers.docker=true
      - --providers.docker.network=${APP_NAME}-internal-${ENV_NAME}
      - --providers.docker.constraints=Label(`stack.name`,`${APP_NAME}-${ENV_NAME}`)
      - --entryPoints.web.address=${TRAEFIK_ENTRYPOINTS_WEB_ADDRESS}
      # forwardedHeaders.insecure is deliberately NOT set: Traefik is the edge
      # here, so a client-supplied X-Forwarded-For would be trusted verbatim and
      # let an attacker rotate the key express-rate-limit uses. Traefik now sets
      # the header itself from the real peer address. If a CDN or load balancer
      # is ever placed in front, add its ranges with
      # --entryPoints.web.forwardedHeaders.trustedIPs=<cidr,cidr> instead.
      - --providers.docker.exposedByDefault=${TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT}
      - --api.insecure=${TRAEFIK_API_INSECURE}
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG}
      - --ping=true
      - --api.dashboard=true
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
    restart: always
    ports:
      - ${TRAEFIK_PORT}:80
      - ${TRAEFIK_DASH_PORT}:8080
    networks:
      - internal
      - external
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  gatelin_migration:
    build:
      context: ${PWD}/db/liquibase
      dockerfile: dockerfile.prod
      args:
        LIQUIBASE_VERSION: ${LIQUIBASE_VERSION}
    image: ghcr.io/alten-group/gatelin-migration:${VERSION:-latest}
    container_name: ${GATELIN_MIGRATION_HOST}
    hostname: ${GATELIN_MIGRATION_HOST}
    environment:
      TZ: ${TZ}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      DB_JOB_USER: ${GATELIN_DB_JOB_USER}
      DB_JOB_PWD: ${GATELIN_DB_JOB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  ms_user_mock:
    build:
      context: ${PWD}/mocks/ms_user
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    container_name: ${MSUSER_HOST}
    hostname: ${MSUSER_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
    networks:
      - internal
    volumes:
      - ${PWD}/mocks/ms_user/src:/usr/src/app/src
      - ms_user_mock_node_modules:/usr/src/app/node_modules

  foxnox_migration:
    image: ghcr.io/alten-group/foxnox-migration:${FOXNOX_VERSION:-0.1.0-alpha.1}
    container_name: ${FOXNOX_MIGRATION_HOST}
    hostname: ${FOXNOX_MIGRATION_HOST}
    environment:
      TZ: ${TZ}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${FOXNOX_DB_NAME}
      DB_USER: ${FOXNOX_DB_USER}
      DB_PWD: ${FOXNOX_DB_PWD}
      DB_JOB_USER: ${FOXNOX_DB_JOB_USER}
      DB_JOB_PWD: ${FOXNOX_DB_JOB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  foxnox:
    image: ghcr.io/alten-group/foxnox:${FOXNOX_VERSION:-0.1.0-alpha.1}
    container_name: ${FOXNOX_HOST}
    hostname: ${FOXNOX_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
      TZ: ${TZ}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${FOXNOX_DB_NAME}
      DB_USER: ${FOXNOX_DB_USER}
      DB_PWD: ${FOXNOX_DB_PWD}
      DB_JOB_USER: ${FOXNOX_DB_JOB_USER}
      DB_JOB_PWD: ${FOXNOX_DB_JOB_PWD}
      PWD_SECRET: ${FOXNOX_PWD_SECRET}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      SERVER_SCHEME: ${SERVER_SCHEME}
      SERVICE_NAME: ${FOXNOX_HOST}
      ACCESS_TOKEN_DURATION: ${FOXNOX_ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${FOXNOX_REFRESH_TOKEN_DURATION}
      WEB_PUBLIC_BASE: ${WEB_PUBLIC_BASE:-/api/foxnox/web}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-${SERVER_SCHEME}${SERVER_URL}:${TRAEFIK_PORT}}
      WEB_LOGIN_RESUME_URL: ${WEB_LOGIN_RESUME_URL:-${SERVER_SCHEME}${SERVER_URL}:${TRAEFIK_PORT}${ADMIN_BASE_PATH}/login}
      USER_SEARCH_URL: ${MSUSER_SEARCH_URL}
      WEB_BRAND_NAME: ${WEB_BRAND_NAME:-Foxnox}
      WEB_BRAND_TAGLINE: ${WEB_BRAND_TAGLINE:-Account security}
      WEB_BRAND_MARK: ${WEB_BRAND_MARK:-F}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Required: Foxnox validates ADMIN_PORT at boot when NODE_ENV=production.
      ADMIN_PORT: ${FOXNOX_ADMIN_PORT}
      ADMIN_BASE_PATH: ${FOXNOX_ADMIN_BASE_PATH:-/foxnox}
      ADMIN_SSO_TOKEN_KEY: ${ADMIN_SSO_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      foxnox_migration:
        condition: service_completed_successfully
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.foxnox.rule=PathPrefix(`/api/foxnox`)"
      - "traefik.http.routers.foxnox.priority=100"
      - "traefik.http.routers.foxnox.entrypoints=web"
      - "traefik.http.routers.foxnox.service=foxnox"
      - "traefik.http.routers.foxnox.middlewares=strip-prefix"
      - "traefik.http.services.foxnox.loadbalancer.server.port=${DEFAULT_PORT}"
      - "traefik.http.routers.foxnox-admin.rule=PathPrefix(`${FOXNOX_ADMIN_BASE_PATH:-/foxnox}`)"
      - "traefik.http.routers.foxnox-admin.entrypoints=web"
      - "traefik.http.routers.foxnox-admin.service=foxnox-admin"
      - "traefik.http.services.foxnox-admin.loadbalancer.server.port=${FOXNOX_ADMIN_PORT}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/foxnox/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  gatelin:
    image: ghcr.io/alten-group/gatelin:${VERSION:-latest}
    container_name: ${GATELIN_HOST}
    hostname: ${GATELIN_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
      TZ: ${TZ}
      PWD_CHECK_URL: ${GATELIN_PWD_CHECK_URL}
      PWD_CHALLENGES_URL: ${GATELIN_PWD_CHALLENGES_URL:-}
      PWD_TRUSTED_DEVICES_URL: ${GATELIN_PWD_TRUSTED_DEVICES_URL:-}
      PWD_LOGIN_TICKET_URL: ${GATELIN_PWD_LOGIN_TICKET_URL:-}
      USER_SEARCH_URL: ${MSUSER_SEARCH_URL}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      DB_JOB_USER: ${GATELIN_DB_JOB_USER}
      DB_JOB_PWD: ${GATELIN_DB_JOB_PWD}
      TOKEN_SECRET: ${GATELIN_TOKEN_SECRET}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      SERVER_SCHEME: ${SERVER_SCHEME}
      SERVICE_NAME: ${GATELIN_HOST}
      ACCESS_TOKEN_DURATION: ${GATELIN_ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${GATELIN_REFRESH_TOKEN_DURATION}
      REFRESH_TOKEN_COOKIE: ${GATELIN_REFRESH_TOKEN_COOKIE}
      SESSION_RATE_LIMIT_MAX: ${GATELIN_SESSION_RATE_LIMIT_MAX}
      ADMIN_RATE_LIMIT_MAX: ${GATELIN_ADMIN_RATE_LIMIT_MAX}
      PROXY_RATE_LIMIT_MAX: ${GATELIN_PROXY_RATE_LIMIT_MAX}
      UPSTREAM_TIMEOUT_MS: ${GATELIN_UPSTREAM_TIMEOUT_MS}
      PWD_MIN_LENGTH_POLICY: ${GATELIN_PWD_MIN_LENGTH_LEGACY}
      PWD_MAX_LENGTH_POLICY: ${GATELIN_PWD_MAX_LENGTH_LEGACY}
      PWD_NUMBERS_POLICY: ${GATELIN_PWD_NUMBERS_LEGACY}
      PWD_UPPERCASE_POLICY: ${GATELIN_PWD_UPPERCASE_LEGACY}
      PWD_LOWERCASE_POLICY: ${GATELIN_PWD_LOWERCASE_LEGACY}
      PWD_SYMBOLS_POLICY: ${GATELIN_PWD_SYMBOLS_LEGACY}
      # Unset to disable the admin UI; set to enable it on a dedicated internal port
      ADMIN_PORT: ${ADMIN_PORT}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      ADMIN_PASSWORD_RECOVERY_URL: ${ADMIN_PASSWORD_RECOVERY_URL:-}
      ADMIN_SSO_TOKEN_KEY: ${ADMIN_SSO_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      gatelin_migration:
        condition: service_completed_successfully
      foxnox:
        condition: service_healthy
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.gatelin.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gatelin.entrypoints=web"
      - "traefik.http.routers.gatelin.service=gatelin"
      - "traefik.http.routers.gatelin.middlewares=strip-prefix"
      - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-prefix.stripprefix.forceSlash=false"
      - "traefik.http.services.gatelin.loadBalancer.server.port=${DEFAULT_PORT}"
      - "traefik.http.routers.admin-ui.rule=PathPrefix(`${ADMIN_BASE_PATH}`)"
      - "traefik.http.routers.admin-ui.entrypoints=web"
      - "traefik.http.routers.admin-ui.service=admin-ui"
      - "traefik.http.services.admin-ui.loadBalancer.server.port=${ADMIN_PORT}"
    healthcheck: *healthcheck

networks:
  internal:
    name: ${APP_NAME}-internal-${ENV_NAME}
    driver: bridge
  external:
    name: ${APP_NAME}-external-${ENV_NAME}
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ms_user_mock_node_modules:
