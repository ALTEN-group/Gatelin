    hostname: ${WEB_HOST}
    profiles: ["web"]
    networks:
      - internal
    logging: *logging
      
networks:
  internal:
    name: ${APP_NAME}-external-${ENV_NAME}
    driver: bridge 
  external:
    name: ${APP_NAME}-internal-${ENV_NAME}
    driver: bridge


secrets:
  apk_repository:
    environment: APK_REPOSITORY
  apt_repository:
    environment: APT_REPOSITORY
  npmrc:
    environment: NPMRC


volumes:
  postgres_data:
    driver: local
  postgis_data:
    driver: local
  user_assets:
    driver: local
  mail_assets:
    driver: local
  event_assets:
    driver: local