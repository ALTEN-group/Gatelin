name: ${APP_NAME}

x-logging-conf: &logging
  driver: "json-file"
  options:
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-service-healthcheck: &healthcheck
  test: ["CMD", "node", "/usr/src/app/node_modules/health/test.js"]
  interval: 10s
  timeout: 5s
  retries: 5

# dockerfile mount during build
x-secret-args: &secretArgs
  secrets:
    - apt_repository
    - apk_repository
    - npmrc

# mount for run
x-secret-mount: &secretMount
  - source: npmrc
    target: /home/user/.npmrc

x-default-args: &defaultArgs
  UID: ${UID}
  GID: ${GID}
  TZ: ${TZ}
  LOCALE: ${LOCALE}
  HOME_PATH: ${HOME_PATH}
  
x-default-envs: &defaultEnvs
  PORT: ${DEFAULT_PORT}
  TZ: ${TZ}

services:

  postgres:
    image: ${REPO_URL}:${REPO_PORT}/${APP_NAME}_postgres:${APP_VERSION}
    build:
      context: ${PWD}/db/pgsql
      dockerfile: dockerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
    profiles: ["prod", "db"]
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGRES_DBS}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PWD}
      #liquibase
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      # ms_user
      MSUSER_USER: ${MSUSER_DB_USER}
      MSUSER_PWD: ${MSUSER_DB_PWD}
      # ms_gateway
      MSGATEWAY_USER: ${MSGATEWAY_DB_USER}
      MSGATEWAY_PWD: ${MSGATEWAY_DB_PWD}
      # ms_notif
      MSNOTIF_USER: ${MSNOTIF_DB_USER}
      MSNOTIF_PWD: ${MSNOTIF_DB_PWD}
      # ms_mail
      MSMAIL_USER: ${MSMAIL_DB_USER}
      MSMAIL_PWD: ${MSMAIL_DB_PWD}
      # ms_cron
      MSCRON_USER: ${MSCRON_DB_USER}
      MSCRON_PWD: ${MSCRON_DB_PWD}
    stdin_open: true
    tty: true
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "${MSUSER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging


  postgis:
    image: ${REPO_URL}:${REPO_PORT}/${APP_NAME}_postgis:${APP_VERSION}
    build:
      context: ${PWD}/db/postgis
      dockerfile: dockerfile
      args:
        - POSTGIS_VERSION=${POSTGIS_VERSION}
    profiles: ["prod", "db"]
    container_name: ${POSTGIS_HOST}
    hostname: ${POSTGIS_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGIS_DBS}
      POSTGRES_USER: ${POSTGIS_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGIS_ROOT_PWD}
      #liquibase
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      #ms_event
      MSEVENT_USER: ${MSEVENT_DB_USER}
      MSEVENT_PWD: ${MSEVENT_DB_PWD}
    stdin_open: true
    tty: true
    networks:
      - internal
    volumes:
