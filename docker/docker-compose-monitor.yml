  alloy:
    image: grafana/alloy:latest
    hostname: sdc-demo-alloy
    environment:
      PG_EXPORTER_HOST: pg_exporter:9187
      PROJECT_NAME: ${PROJECT_NAME}
      MONITORING_URL: ${MONITORING_URL}
    ports:
      - "12346:12345"
    volumes:
      - "./alloy/config.alloy:/etc/alloy/config.alloy"
    networks:
      - project
      - monitoring
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:12345",
      "--stability.level=public-preview",
      "/etc/alloy/config.alloy",
    ]


volumes:
  grafana-storage:
    name: grafana-storage
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /projects/mon/grafana
  mimir-storage:
    name: mimir-storage
    driver: local
  loki-storage:
    name: ${APP_NAME}-loki-volume
    driver: local
