name: ${APP_NAME}

x-logging-conf: &logging
  driver: "json-file"
  options: 
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-service-healthcheck: &healthcheck
  test: ["CMD", "node", "/usr/src/app/node_modules/health/test.js"]
  interval: 10s
  timeout: 5s
  retries: 5

# dockerfile mount during build
x-secret-args: &secretArgs
  secrets:
    - apt_repository
    - apk_repository
    - npmrc

# mount for run
x-secret-mount: &secretMount
  - source: npmrc
    target: /home/user/.npmrc

x-default-args: &defaultArgs
  UID: ${UID}
  GID: ${GID}
  TZ: ${TZ}
  HOME_PATH: ${HOME_PATH}

x-default-envs: &defaultEnvs
  PORT: ${DEFAULT_PORT}
  TZ: ${TZ}

x-resources-limits:
  # - &cadvisorLimit
  #   cpus: ${CADVISOR_LIMIT_CPUS}
  #   mem_limit: ${CADVISOR_LIMIT_MEM}
  # - &prometheusLimit
  #   cpus: ${PROMETHEUS_LIMIT_CPUS}
  #   mem_limit: ${PROMETHEUS_LIMIT_MEM}
  - &grafanaLimit
    cpus: ${GRAFANA_LIMIT_CPUS}
    mem_limit: ${GRAFANA_LIMIT_MEM}
  # - &promtailLimit
  #   cpus: ${PROMTAIL_LIMIT_CPUS}
  #   mem_limit: ${PROMTAIL_LIMIT_MEM}
  - &lokiLimit
    cpus: ${LOKI_LIMIT_CPUS}
    mem_limit: ${LOKI_LIMIT_MEM}

x-labels-conf: &labels
  logging: alloy
  logging_project: ${APP_NAME}
  logging_env: ${ENV_NAME}

