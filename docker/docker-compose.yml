name: ${APP_NAME}

x-service-healthcheck: &healthcheck
  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/gateway/health"]
  interval: 10s
  timeout: 5s
  retries: 5

# dockerfile mount during build
x-secret-args: &secretArgs
  secrets:
    - apt_repository
    - apk_repository
    - npmrc

# mount for run
x-secret-mount: &secretMount
  - source: npmrc
    target: /home/user/.npmrc

x-default-args: &defaultArgs
  UID: ${UID}
  GID: ${GID}
  TZ: ${TZ}

x-default-envs: &defaultEnvs
  PORT: ${DEFAULT_PORT}
  TZ: ${TZ}

services:

  postgres:
    platform: linux/amd64
    build:
      context: ${PWD}/db/pgsql
      dockerfile: dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGRES_DBS}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PWD}
      #liquibase
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      # ms_gateway
      GATELIN_USER: ${GATELIN_DB_USER}
      GATELIN_PWD: ${GATELIN_DB_PWD}
    stdin_open: true
    tty: true
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "${GATELIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: ${TRAEFIK_HOST}
    hostname: ${TRAEFIK_HOST}
    command:
      - --providers.docker=true
      - --providers.docker.network=${APP_NAME}-internal-${ENV_NAME}
      - --providers.docker.constraints=Label(`stack.name`,`${APP_NAME}-${ENV_NAME}`)
      - --entryPoints.web.address=${TRAEFIK_ENTRYPOINTS_WEB_ADDRESS}
      - --entrypoints.web.forwardedHeaders=true
      - --entryPoints.web.forwardedHeaders.insecure=true
      - --providers.docker.exposedByDefault=${TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT}
      - --api.insecure=${TRAEFIK_API_INSECURE}
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG}
      - --ping=true
      - --api.dashboard=true
    labels:
      - "traefik.http.middlewares.gateway.stripprefix.prefixes=/api"     
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
    restart: always
    ports:
      - ${TRAEFIK_PORT}:80
      - ${TRAEFIK_DASH_PORT}:8080
    networks:
      - internal
      - external
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  gatelin_migration:
    build:
      context: ${PWD}/db/liquibase
      dockerfile: dockerfile
      args:
        LIQUIBASE_VERSION: ${LIQUIBASE_VERSION}
    container_name: ${GATELIN_MIGRATION_HOST}
    hostname: ${GATELIN_MIGRATION_HOST}
    environment:
      TZ: ${TZ}
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${PWD}/db/liquibase/gateway/:/liquibase/changelog
      - ${PWD}/db/liquibase/data/:/liquibase/data

  gatelin:
    build:
      context: ${PWD}
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    image: dwtechs/gatelin:${NODE_ENV:-development}
    container_name: ${GATELIN_HOST}
    hostname: ${GATELIN_HOST}
    depends_on:
      postgres:
        condition: service_healthy
      gatelin_migration:
        condition: service_completed_successfully
    environment:
      PORT: ${DEFAULT_PORT}
      TZ: ${TZ}
      PWD_CHECK_URL: ${GATELIN_PWD_CHECK_URL}
      USER_SEARCH_URL: ${GATELIN_USER_SEARCH_URL}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${GATELIN_DB_NAME}
      DB_USER: ${GATELIN_DB_USER}
      DB_PWD: ${GATELIN_DB_PWD}
      TOKEN_SECRET: ${GATELIN_TOKEN_SECRET}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      SERVER_SCHEME: ${SERVER_SCHEME}
      SERVICE_NAME: ${GATELIN_HOST}
      ACCESS_TOKEN_DURATION: ${GATELIN_ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${GATELIN_REFRESH_TOKEN_DURATION}
      # PWD_MIN_LENGTH_POLICY: ${GATELIN_PWD_MIN_LENGTH_LEGACY}
      # PWD_MAX_LENGTH_POLICY: ${GATELIN_PWD_MAX_LENGTH_LEGACY}
      # PWD_NUMBERS_POLICY: ${GATELIN_PWD_NUMBERS_LEGACY}
      # PWD_UPPERCASE_POLICY: ${GATELIN_PWD_UPPERCASE_LEGACY}
      # PWD_LOWERCASE_POLICY: ${GATELIN_PWD_LOWERCASE_LEGACY}
      # PWD_SYMBOLS_POLICY: ${GATELIN_PWD_SYMBOLS_LEGACY}
    networks:
      - internal
    volumes:
      - ${PWD}/src:/usr/src/app/src
      - ${PWD}/tests:/usr/src/app/tests
      - gateway_node_modules:/usr/src/app/node_modules
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.service=gateway"
      - "traefik.http.routers.gateway.middlewares=strip-prefix"
      - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-prefix.stripprefix.forceSlash=false"
      - "traefik.http.services.gateway.loadBalancer.server.port=${DEFAULT_PORT}"
    healthcheck: *healthcheck
  
  admin:
    build:
      context: ${PWD}/admin
      dockerfile: dockerfile
      <<: *secretArgs
      args:
        <<: *defaultArgs
        NODE_VERSION: ${ADMIN_NODE_VERSION}
    secrets: *secretMount
    container_name: ${ADMIN_HOST}
    hostname: ${ADMIN_HOST}
    environment:
      <<: *defaultEnvs
    networks:
      - internal
    volumes:
      - ${PWD}/admin:/usr/src/app
      - admin_node_modules:/usr/src/app/node_modules
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.service=admin"
      - "traefik.http.services.admin.loadbalancer.server.port=${ADMIN_PORT}"

  adminer:
    image: ${ADMINER_VERSION}
    container_name: ${ADMINER_HOST}
    hostname: ${ADMINER_HOST}
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST}
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DESIGN: pappu687
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.service=adminer"
      - "traefik.http.routers.adminer.middlewares=adminer-stripprefix"
      - "traefik.http.services.adminer.loadbalancer.server.port=${ADMINER_PORT}"
      - "traefik.http.middlewares.adminer-stripprefix.stripprefix.prefixes=/adminer"
      - "traefik.http.middlewares.adminer-stripprefix.stripprefix.forceSlash=false"

  dozzle:
    container_name: ${DOZZLE_HOST}
    hostname: ${DOZZLE_HOST}
    image: ghcr.io/amir20/dozzle:latest
    environment:
      DOZZLE_BASE: /dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.dozzle.rule=PathPrefix(`/dozzle`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.routers.dozzle.service=dozzle"
      - "traefik.http.services.dozzle.loadbalancer.server.port=${DOZZLE_PORT}"

  swagger:
    build:
      context: ${PWD}/swagger
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    container_name: ${SWAGGER_HOST}
    hostname: ${SWAGGER_HOST}
    environment:
      SERVICE_NAME: ${SWAGGER_HOST}
      PORT: ${DEFAULT_PORT}
      BASE_PATH: /swagger
    volumes:
      - ${PWD}/swagger/src:/usr/src/app/src
      - swagger_node_modules:/usr/src/app/node_modules
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.swagger.rule=PathPrefix(`/swagger`)"
      - "traefik.http.routers.swagger.entrypoints=web"
      - "traefik.http.routers.swagger.service=swagger"
      - "traefik.http.services.swagger.loadbalancer.server.port=${DEFAULT_PORT}"

  website:
    build:
      context: ${PWD}/website
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    container_name: ${WEBSITE_HOST}
    hostname: ${WEBSITE_HOST}
    volumes:
      - ${PWD}/website/docs:/usr/src/app/docs
      - website_node_modules:/usr/src/app/node_modules
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.website.rule=PathPrefix(`/docs`)"
      - "traefik.http.routers.website.entrypoints=web"
      - "traefik.http.routers.website.service=website"
      - "traefik.http.services.website.loadbalancer.server.port=5173"

  ms_user_mock:
    build:
      context: ${PWD}/mocks/ms_user
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    container_name: ${MSUSER_HOST}
    hostname: ${MSUSER_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
    networks:
      - internal
    volumes:
      - ${PWD}/mocks/ms_user/src:/usr/src/app/src
      - ms_user_mock_node_modules:/usr/src/app/node_modules

  ms_auth_mock:
    build:
      context: ${PWD}/mocks/ms_auth
      dockerfile: dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        TZ: ${TZ}
        NODE_VERSION: ${NODE_VERSION}
        NODE_ENV: ${NODE_ENV}
    container_name: ${MSAUTH_HOST}
    hostname: ${MSAUTH_HOST}
    environment:
      PORT: ${DEFAULT_PORT}
    networks:
      - internal
    volumes:
      - ${PWD}/mocks/ms_auth/src:/usr/src/app/src
      - ms_auth_mock_node_modules:/usr/src/app/node_modules

networks:
  internal:
    name: ${APP_NAME}-internal-${ENV_NAME}
    driver: bridge 
  external:
    name: ${APP_NAME}-external-${ENV_NAME}
    driver: bridge
    
secrets:
  apk_repository:
    environment: APK_REPOSITORY
  apt_repository:
    environment: APT_REPOSITORY
  npmrc:
    environment: NPMRC


volumes:
  postgres_data:
    driver: local
  gateway_node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/node_modules
  admin_node_modules:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/admin/node_modules
  swagger_node_modules:
  website_node_modules:
  ms_user_mock_node_modules:
  ms_auth_mock_node_modules:
