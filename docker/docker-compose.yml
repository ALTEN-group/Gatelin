name: ${APP_NAME}

x-logging-conf: &logging
  driver: "json-file"
  options: 
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-service-healthcheck: &healthcheck
  test: ["CMD", "node", "/usr/src/app/node_modules/health/test.js"]
  interval: 10s
  timeout: 5s
  retries: 5

# dockerfile mount during build
x-secret-args: &secretArgs
  secrets:
    - apt_repository
    - apk_repository
    - npmrc

# mount for run
x-secret-mount: &secretMount
  - source: npmrc
    target: /home/user/.npmrc

x-default-args: &defaultArgs
  UID: ${UID}
  GID: ${GID}
  TZ: ${TZ}
  LOCALE: ${LOCALE}
  HOME_PATH: ${HOME_PATH}

x-default-envs: &defaultEnvs
  PORT: ${DEFAULT_PORT}
  TZ: ${TZ}

x-resources-limits:
  - &pgsqlLimits
    cpus: ${PGSQL_LIMIT_CPUS}
    mem_limit: ${PGSQL_LIMIT_MEM}
  - &nodeLimits
    cpus: ${NODE_LIMIT_CPUS}
    mem_limit: ${NODE_LIMIT_MEM}
  - &minLimits
    cpus: ${MIN_LIMIT_CPUS}
    mem_limit: ${MIN_LIMIT_MEM}


