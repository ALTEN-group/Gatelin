      - "traefik.http.routers.admin.rule=PathPrefix(`/admin`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.service=admin"
      - "traefik.http.routers.admin.middlewares=admin"
      - "traefik.http.services.admin.loadbalancer.server.port=${ADMIN_PORT}"
      # - "traefik.http.services.admin.loadbalancer.passhostheader=true"
      - "traefik.http.middlewares.admin.stripprefix.prefixes=/admin"
    logging: *logging

  
  mobile:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_mobile:${APP_VERSION}
    container_name: ${MOBILE_HOST}
    hostname: ${MOBILE_HOST}
    profiles: ["mobile"]
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.mobile.rule=PathPrefix(`/mobile`)"
      - "traefik.http.routers.mobile.entrypoints=web"
      - "traefik.http.routers.mobile.service=mobile"
      - "traefik.http.routers.mobile.middlewares=mobile"
      - "traefik.http.services.mobile.loadbalancer.server.port=${MOBILE_PORT}"
      # - "traefik.http.services.mobile.loadbalancer.passhostheader=true"
      - "traefik.http.middlewares.mobile.stripprefix.prefixes=/mobile"
    logging: *logging


  adminer:
    image: ${ADMINER_VERSION}
    container_name: ${ADMINER_HOST}
    hostname:  ${ADMINER_HOST}
    profiles: ["monitor", "adminer"]
    networks:
      - internal
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST}
      ADMINER_DEFAULT_DRIVER: pgsql
      ADMINER_DESIGN: pappu687
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.adminer.rule=PathPrefix(`/adminer`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.routers.adminer.service=adminer"
      - "traefik.http.routers.adminer.middlewares=adminer"
      - "traefik.http.services.adminer.loadbalancer.server.port=${ADMINER_PORT}"
      - "traefik.http.middlewares.adminer.stripprefix.prefixes=/adminer"


  postgres_exporter:
    image: ${PG_EXPORTER_VERSION}
    container_name: ${PG_EXPORTER_HOST}
    profiles: ["monitor"]
    environment:
      - DATA_SOURCE_NAME=${PG_EXPORTER_SOURCE}
    ports:
      - ${PG_EXPORTER_PORT}:${PG_EXPORTER_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      postgis:
        condition: service_healthy
    networks:
      - internal


networks:
  internal:
    name: ${APP_NAME}-external-${ENV_NAME}
    driver: bridge 
  external:
    name: ${APP_NAME}-internal-${ENV_NAME}
    driver: bridge


volumes:
  postgres_data:
    driver: local
  postgis_data:
    driver: local
  user_assets:
    driver: local
  mail_assets:
    driver: local
  event_assets:
    driver: local
  rabbitmq-volume:
    driver: local