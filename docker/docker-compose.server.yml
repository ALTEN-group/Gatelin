    networks:
      - internal
    depends_on:
      ms_event:
        condition: service_healthy
      ms_cron:
        condition: service_healthy
    healthcheck: *healthcheck
    logging: *logging


  admin:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_admin:${APP_VERSION}
    container_name: ${ADMIN_HOST}
    hostname: ${ADMIN_HOST}
    profiles: ["admin"]
    networks:
