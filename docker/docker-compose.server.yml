  ms_gateway:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_${MSGATEWAY_SERVICE_NAME}:${APP_VERSION}
    container_name: ${MSGATEWAY_HOST}
    hostname: ${MSGATEWAY_HOST}
    profiles: ["prod", "back"]
    environment:
      <<: *defaultEnvs
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${MSUSER_DB_NAME}
      DB_USER: ${MSUSER_DB_USER}
      DB_PWD: ${MSUSER_DB_PWD}
      TOKEN_SECRET: ${MSUSER_TOKEN_SECRET}
      PWD_SECRET: ${MSUSER_PWD_SECRET}
      # APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
      # APP_WEBSITE: ${APP_WEBSITE}
      # SERVICE_NAME: ${MSUSER_HOST}
    networks:
      - internal    
    depends_on:
      postgres:
        condition: service_healthy
      ms_user_migration:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.service=gateway"
      - "traefik.http.routers.gateway.middlewares=strip-prefix"
      - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/api"
      - "traefik.http.middlewares.strip-prefix.stripprefix.forceSlash=false"
      - "traefik.http.services.gateway.loadBalancer.server.port=${DEFAULT_PORT}"
    healthcheck: *healthcheck
    logging: *logging


  ms_user:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_${MSUSER_SERVICE_NAME}:${APP_VERSION}
    container_name: ${MSUSER_HOST}
    hostname: ${MSUSER_HOST}
    profiles: ["prod", "back"]
    environment:
      <<: *defaultEnvs
      MSMAIL_URL: ${MSMAIL_URL}
      IMG_FOLDER: ./src/public/img/
      PUBLIC_IMG_FOLDER: user/img/
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${MSUSER_DB_NAME}
      DB_USER: ${MSUSER_DB_USER}
      DB_PWD: ${MSUSER_DB_PWD}
      TOKEN_SECRET: ${MSUSER_TOKEN_SECRET}
      PWD_SECRET: ${MSUSER_PWD_SECRET}
      PWD_MIN_LENGTH: ${MSUSER_PWD_MIN_LENGTH}
      PWD_MAX_LENGTH: ${MSUSER_PWD_MAX_LENGTH}
      PWD_AUTO_LENGTH: ${MSUSER_PWD_AUTO_LENGTH}
      PWD_AUTO_NUMBERS: ${MSUSER_PWD_AUTO_NUMBERS}
      PWD_AUTO_UPPERCASE: ${MSUSER_PWD_AUTO_UPPERCASE}
      PWD_AUTO_LOWERCASE: ${MSUSER_PWD_AUTO_LOWERCASE}
      PWD_AUTO_SYMBOLS: ${MSUSER_PWD_AUTO_SYMBOLS}
      PWD_AUTO_STRICT: ${MSUSER_PWD_AUTO_STRICT}
      PWD_AUTO_EXCLUDE_SIMILAR_CHARS: ${MSUSER_PWD_AUTO_EXCLUDE_SIMILAR_CHARS}
      FIRSTNAME_MIN_LENGTH: ${MSUSER_FIRSTNAME_MIN_LENGTH}
      LASTNAME_MIN_LENGTH: ${MSUSER_LASTNAME_MIN_LENGTH}
      FIRSTNAME_MAX_LENGTH: ${MSUSER_FIRSTNAME_MAX_LENGTH}
      LASTNAME_MAX_LENGTH: ${MSUSER_LASTNAME_MAX_LENGTH}
      ACCESS_TOKEN_DURATION: ${MSUSER_ACCESS_TOKEN_DURATION}
      REFRESH_TOKEN_DURATION: ${MSUSER_REFRESH_TOKEN_DURATION}
      APP_NAME: ${APP_NAME}
      APP_WEBSITE: ${APP_WEBSITE}
      SERVICE_NAME: ${MSUSER_HOST}
    networks:
      - internal    
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - user_assets:/usr/src/app/src/public
    healthcheck: *healthcheck
    logging: *logging


