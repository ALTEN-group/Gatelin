      DB_NAME: ${MSCRON_DB_NAME}
      DB_USER: ${MSCRON_DB_USER}
      DB_PWD: ${MSCRON_DB_PWD}
      SERVICE_NAME: ${MSCRON_HOST}
      SERVER_SCHEME: ${SERVER_SCHEME}
      DEFAULT_PORT: ${DEFAULT_PORT}
      APP_NAME: ${APP_NAME}
      ENV_NAME: ${ENV_NAME}
