name: ${APP_NAME}

x-logging-conf: &logging
  driver: "json-file"
  options: 
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-service-healthcheck: &healthcheck
  test: ["CMD", "node", "/usr/src/app/node_modules/health/test.js"]
  interval: 10s
  timeout: 5s
  retries: 5

x-default-envs: &defaultEnvs
  PORT: ${DEFAULT_PORT}
  TZ: ${TZ}


services:

  postgres:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_postgres:${APP_VERSION}
    profiles: ["prod"]
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGRES_DBS}
      POSTGRES_USER: ${POSTGRES_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PWD}
      #liquibase
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      # ms_user
      MSUSER_USER: ${MSUSER_DB_USER}
      MSUSER_PWD: ${MSUSER_DB_PWD}
      # ms_gateway
      MSGATEWAY_USER: ${MSGATEWAY_DB_USER}
      MSGATEWAY_PWD: ${MSGATEWAY_DB_PWD}
      # ms_notif
      MSNOTIF_USER: ${MSNOTIF_DB_USER}
      MSNOTIF_PWD: ${MSNOTIF_DB_PWD}
      # ms_mail
      MSMAIL_USER: ${MSMAIL_DB_USER}
      MSMAIL_PWD: ${MSMAIL_DB_PWD}
      # ms_cron
      MSCRON_USER: ${MSCRON_DB_USER}
      MSCRON_PWD: ${MSCRON_DB_PWD}
    stdin_open: true
    tty: true
    networks:
      - internal
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_ROOT_USER}", "-d", "kong"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging


  postgis:
    image: ${SERVER_URL}:${REPO_PORT}/${APP_NAME}_postgis:${APP_VERSION}
    profiles: ["prod"]
    container_name: ${POSTGIS_HOST}
    hostname: ${POSTGIS_HOST}
    environment:
      TZ: ${TZ}
      POSTGRES_DBS: ${POSTGIS_DBS}
      POSTGRES_USER: ${POSTGIS_ROOT_USER}
      POSTGRES_PASSWORD: ${POSTGIS_ROOT_PWD}
      #liquibase
      LIQUIBASE_USER: ${LIQUIBASE_DB_USER}
      LIQUIBASE_PWD: ${LIQUIBASE_DB_PWD}
      #ms_event
      MSEVENT_USER: ${MSEVENT_DB_USER}
      MSEVENT_PWD: ${MSEVENT_DB_PWD}
    stdin_open: true
    tty: true
    networks:
      - internal
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGIS_ROOT_USER}", "-d", "msevent"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging


  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: ${TRAEFIK_HOST}
    hostname: ${TRAEFIK_HOST}
    profiles: ["prod", "traefik"]
    command:
      - --providers.docker=true
      - --providers.docker.constraints=Label(`stack.name`,`${APP_NAME}-${ENV_NAME}`)
      - --entryPoints.web.address=${TRAEFIK_ENTRYPOINTS_WEB_ADDRESS}
      - --entrypoints.web.forwardedHeaders=true
      - --entryPoints.web.forwardedHeaders.insecure=true
      - --providers.docker.exposedByDefault=${TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT}
      - --api.insecure=${TRAEFIK_API_INSECURE}
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=${TRAEFIK_ACCESSLOG}
      - --ping=true
      - --api.dashboard=false
    labels:
      - "traefik.http.middlewares.gateway.stripprefix.prefixes=/api"     
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.dashboard.rule=HostRegexp(`:${TRAEFIK_DASH_PORT}`) && PathPrefix(`/api`, `/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"
    restart: always
    ports:
      - ${FRONT_PORT}:80
      # - ${TRAEFIK_DASH_PORT}:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
      - external


  rabbitmq:
    image: rabbitmq:${AMQP_VERSION}
    container_name: ${AMQP_HOST}
    hostname: ${AMQP_HOST}
    profiles: ["prod", "amq"]
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${AMQP_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${AMQP_DEFAULT_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${AMQP_DEFAULT_VHOST}
      HEARTBEAT: ${AMQP_HEARTBEAT}
      LISTENERS_TCP_DEFAULT: ${AMQP_LISTENERS_TCP_DEFAULT}
      MANAGEMENT_TCP_PORT: ${AMQP_MANAGEMENT_TCP_PORT}
    restart: always
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - internal
    volumes:
      - rabbitmq-volume:/var/lib/rabbitmq
    labels:
      - "traefik.enable=true"
      - "stack.name=${STACK_NAME}"
      - "traefik.http.routers.rabbit.rule=PathPrefix(`/rabbit`)"
      - "traefik.http.routers.rabbit.entrypoints=web"
      - "traefik.http.routers.rabbit.service=rabbit"
      - "traefik.http.routers.rabbit.middlewares=rabbit"
      - "traefik.http.services.rabbit.loadbalancer.server.port=${AMQP_MANAGEMENT_TCP_PORT}"
      - "traefik.http.middlewares.rabbit.stripprefix.prefixes=/rabbit"


  ms_gateway_migration:
    build:
      context: ${PWD}/db/liquibase
      dockerfile: dockerfile
      <<: *secretArgs
      args:
        LIQUIBASE_VERSION: ${LIQUIBASE_VERSION}
    secrets: *secretMount
    container_name: ${MSGATEWAY_MIGRATION_HOST}
    hostname: ${MSGATEWAY_MIGRATION_HOST}
    profiles: ["dev", "minimal"]
    environment:
      <<: *defaultEnvs
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${MSGATEWAY_DB_NAME}
      DB_USER: ${MSGATEWAY_DB_USER}
      DB_PWD: ${MSGATEWAY_DB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    networks:
      - internal  
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PWD}/db/liquibase/gateway/:/liquibase/changelog


  ms_user_migration:
    build:
      context: ${PWD}/db/liquibase
      dockerfile: dockerfile
      <<: *secretArgs
      args:
        LIQUIBASE_VERSION: ${LIQUIBASE_VERSION}
    secrets: *secretMount
    container_name: ${MSUSER_MIGRATION_HOST}
    hostname: ${MSUSER_MIGRATION_HOST}
    profiles: ["dev", "minimal"]
    environment:
      <<: *defaultEnvs
      LIQUIBASE_COMMAND_USERNAME: ${LIQUIBASE_DB_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${LIQUIBASE_DB_PWD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${MSUSER_DB_NAME}
      DB_USER: ${MSUSER_DB_USER}
      DB_PWD: ${MSUSER_DB_PWD}
      UPDATE: ${LIQUIBASE_UPDATE}
      ROLLBACK: ${LIQUIBASE_ROLLBACK}
      SNAPSHOT: snapshot/snapshot${LIQUIBASE_SNAPSHOT}
      LIQUIBASE_LOG_LEVEL: ${LIQUIBASE_LOG_LEVEL}
      LIQUIBASE_COMMAND_CONTEXTS: ${LIQUIBASE_COMMAND_CONTEXTS}
    networks:
      - internal  
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PWD}/db/liquibase/user/:/liquibase/changelog


  ms_notif_migration:
