<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{heading}} (mock)</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #3d8bfd;
      --border: #2a3648;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --text: #1a2332;
        --muted: #5b6b7c;
        --accent: #1f6feb;
        --border: #d7dee8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1f6feb33, transparent),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    main {
      width: min(26rem, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      margin-bottom: 0.85rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
    }
    input[type="email"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .ok {
      border-left: 3px solid var(--accent);
      padding-left: 0.75rem;
      margin: 0;
    }
    .err {
      border-left: 3px solid #f85149;
      padding-left: 0.75rem;
      margin: 0 0 1rem;
      color: #f85149;
    }
    .row {
      display: flex;
      gap: 0.75rem;
    }
    .row button {
      flex: 1;
    }
    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">ms_pwd mock</span>
    <h1>{{heading}}</h1>
    {{body}}
  </main>
</body>
</html>
