name: Bug report
description: Report a reproducible problem in Gatelin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or security vulnerabilities. Report vulnerabilities through GitHub private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gatelin version
      placeholder: 0.1.0-alpha.7
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Node.js, browser, database, and deployment details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, passwords, and personal data.
      render: shell
