# Managed by coding-pal (templates/callers/plan.yml). Re-generate with scripts/factory/bootstrap.sh instead of editing.
name: Pipeline - Plan

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: 'Upstream run containing the specification artifact (pipeline handoff)'
        required: false
        type: string
      issue_number:
        description: 'Issue number to plan (must already have think.md)'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name == '2-plan')
    uses: ALTEN-group/coding-pal/.github/workflows/pipeline-plan.yml@33a3b849cd689700d9c3297bcbd784f9ca0ba212 # v1
    with:
      issue_number: ${{ inputs.issue_number || github.event.issue.number || '' }}
      workflow_run_id: ${{ inputs.workflow_run_id || '' }}
      project_title: Gatelin
      engine_ref: 33a3b849cd689700d9c3297bcbd784f9ca0ba212
    secrets: inherit
