name: Admin E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "admin/**"
      - "docker/**"
      - "mocks/**"
      - "scripts/**"
      - ".github/workflows/admin-e2e.yml"

concurrency:
  group: admin-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            mocks/ms_pwd/package-lock.json

      - name: Configure env and mocks
        run: |
          ./scripts/setup-env.sh
          ./scripts/setup-mocks.sh

      - name: Start docker stack
        run: ./scripts/start-dev.sh

      - name: Wait for admin
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8100/gatelin/login" >/dev/null; then
              echo "Admin is up"
              exit 0
            fi
            sleep 5
          done
          echo "Admin did not become ready in time"
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev ps
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev logs --tail=200
          exit 1

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: admin
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin/playwright-report/
            admin/test-results/
          retention-days: 7

      - name: Stop docker stack
        if: always()
        run: ./scripts/stop-dev.sh || true
