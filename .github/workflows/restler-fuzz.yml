name: RESTler Deep Fuzz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: RESTler task to run
        type: choice
        options: [fuzz-lean, fuzz]
        default: fuzz
  schedule:
    # Nightly, offset from perf.yml's nightly (02:00) and audit.yml's
    # Monday (06:18) crons, scoped to main via check-changes below.
    - cron: '0 4 * * *'

concurrency:
  group: restler-fuzz-main
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for commits on main since the last successful fuzz run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'restler-fuzz.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            const lastSha = data.workflow_runs[0]?.head_sha;
            const currentSha = context.sha;
            if (!lastSha) {
              core.info('No previous successful fuzz run found — running.');
              core.setOutput('should_run', 'true');
              return;
            }
            core.info(`last fuzz run sha: ${lastSha}`);
            core.info(`current main sha:  ${currentSha}`);
            core.setOutput('should_run', lastSha === currentSha ? 'false' : 'true');

  restler:
    needs: check-changes
    if: github.event_name != 'schedule' || needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fuzz" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure env
        run: |
          ./scripts/setup-env.sh
          # Align container UID/GID with the runner user — see admin-e2e.yml for why.
          sed -i "s|^UID=.*|UID=$(id -u)|" docker/conf/.env.dev
          sed -i "s|^GID=.*|GID=$(id -g)|" docker/conf/.env.dev

      - name: Start docker stack
        run: ./scripts/start-dev.sh

      - name: Run RESTler
        run: ./scripts/run-restler.sh ${{ steps.mode.outputs.mode }}

      - name: Upload RESTler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restler-results-${{ steps.mode.outputs.mode }}
          path: tests/restler/results/
          retention-days: 30

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev ps
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev logs --tail=300

      - name: Stop docker stack
        if: always()
        run: ./scripts/stop-dev.sh || true
