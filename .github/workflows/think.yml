# Managed by coding-pal (templates/callers/think.yml). Re-generate with scripts/factory/bootstrap.sh instead of editing.
name: Pipeline - Think

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze with the Think agent'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

jobs:
  think:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name == '1-think')
    uses: ALTEN-group/coding-pal/.github/workflows/pipeline-think.yml@33a3b849cd689700d9c3297bcbd784f9ca0ba212 # v1
    with:
      issue_number: ${{ inputs.issue_number || github.event.issue.number }}
      project_title: Gatelin
      engine_ref: 33a3b849cd689700d9c3297bcbd784f9ca0ba212
    secrets: inherit
