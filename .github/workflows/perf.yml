name: Performance Tests

on:
  workflow_dispatch:
  schedule:
    # Nightly, off-peak, offset from the Monday audit cron (audit.yml) and
    # scoped to main via check-changes below (schedule always runs on the
    # default branch).
    - cron: '0 2 * * *'

concurrency:
  group: perf-main
  cancel-in-progress: false

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for commits on main since the last successful perf run
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'perf.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            const lastSha = data.workflow_runs[0]?.head_sha;
            const currentSha = context.sha;
            if (!lastSha) {
              core.info('No previous successful perf run found — running.');
              core.setOutput('should_run', 'true');
              return;
            }
            core.info(`last perf run sha: ${lastSha}`);
            core.info(`current main sha:  ${currentSha}`);
            core.setOutput('should_run', lastSha === currentSha ? 'false' : 'true');

  perf:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure env
        run: |
          ./scripts/setup-env.sh
          # Align container UID/GID with the runner user — see admin-e2e.yml for why.
          sed -i "s|^UID=.*|UID=$(id -u)|" docker/conf/.env.dev
          sed -i "s|^GID=.*|GID=$(id -g)|" docker/conf/.env.dev

      - name: Start docker stack
        run: ./scripts/start-dev.sh

      - name: Run health baseline
        run: ./scripts/run-perf.sh health

      - name: Run login flow
        run: ./scripts/run-perf.sh login

      - name: Run authenticated resource CRUD flow
        run: ./scripts/run-perf.sh resource-crud

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: tests/perf/results/
          retention-days: 30

      - name: Convert k6 summaries to benchmark format
        if: always()
        run: node tests/perf/scripts/to-benchmark.js

      # Publishes p95 latency / error-rate history to the gh-pages branch and
      # charts it at https://<org>.github.io/Gatelin/dev/perf/ — comments on
      # the tracked issue/PR and fails the job if a metric regresses beyond
      # alert-threshold vs. the stored baseline.
      - name: Store benchmark result and alert on regression
        if: always()
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: tests/perf/results/benchmark.json
          benchmark-data-dir-path: dev/perf
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: true

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev ps
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev logs --tail=300

      - name: Stop docker stack
        if: always()
        run: ./scripts/stop-dev.sh || true
