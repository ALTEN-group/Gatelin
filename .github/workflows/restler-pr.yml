name: RESTler API Fuzzing (PR)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'swagger/**'
      - 'src/routes/**'
      - 'src/entities/**'
      - 'docker/docker-compose.restler.yml'
      - 'docker/restler/**'
      - '.github/workflows/restler-pr.yml'

concurrency:
  group: restler-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure env
        run: |
          ./scripts/setup-env.sh
          # Align container UID/GID with the runner user — see admin-e2e.yml for why.
          sed -i "s|^UID=.*|UID=$(id -u)|" docker/conf/.env.dev
          sed -i "s|^GID=.*|GID=$(id -g)|" docker/conf/.env.dev

      - name: Start docker stack
        run: ./scripts/start-dev.sh

      - name: Run RESTler (test)
        run: ./scripts/run-restler.sh test

      - name: Upload RESTler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restler-results-test
          path: tests/restler/results/
          retention-days: 30

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev ps
          docker compose -f docker/docker-compose.yml --env-file docker/conf/.env.dev logs --tail=300

      - name: Stop docker stack
        if: always()
        run: ./scripts/stop-dev.sh || true
