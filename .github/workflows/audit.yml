name: Weekly Audit

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:17 UTC (offset from :00 to avoid GitHub's peak scheduling congestion)
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write
  copilot-requests: write

jobs:
  audit:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install APM CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: curl -sSL https://aka.ms/apm-unix | sh

      - name: Install APM packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: apm install

      - name: Run static checks
        run: |
          {
            echo "# Weekly Audit — $(date -u +%F)"
            echo
            echo "## npm audit"
            echo '```'
            npm audit || true
            echo '```'
            echo
            echo "## Lint (Biome)"
            echo '```'
            npx biome check . || true
            echo '```'
            echo
            echo "## Outdated dependencies"
            echo '```'
            npm outdated || true
            echo '```'
            echo
            echo "## TODOs / FIXMEs"
            echo '```'
            git grep -n 'TODO\|FIXME' -- src/ || echo '(no output)'
            echo '```'
          } > report.md

      # Runs the "Node.js Express.js Back-end Code Audit" agent installed via APM
      # from ALTEN-group/coding-pal (see apm.yml/apm.lock.yaml). Its profile
      # scopes the audit to src/ and db/liquibase/, bans re-running the checks
      # above, and picks up the installed Node/Express/Postgres instructions
      # automatically. `write` stays denied since this is a reporting-only audit.
      - name: Run Copilot audit agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AUDITS_MODEL: ${{ vars.COPILOT_AUDITS_MODEL }}
        run: |
          set +e
          copilot \
            --agent node-express-back-end-code-audit \
            -p "Run the audit." \
            -s \
            --no-ask-user \
            --allow-all-tools \
            --deny-tool write \
            ${COPILOT_AUDITS_MODEL:+--model "$COPILOT_AUDITS_MODEL"} \
            | tee copilot-output.txt
          status="${PIPESTATUS[0]}"
          set -e
          {
            echo
            echo "---"
            echo
            echo "## AI Audit Summary"
            echo
            if [ "$status" -eq 0 ] && [ -s copilot-output.txt ]; then
              cat copilot-output.txt
            else
              echo "_Copilot CLI call failed (exit $status)._"
            fi
          } >> report.md

      - name: Create audit issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Audit — ${date}`,
              body,
              labels: ['audit'],
            });
            core.info(`Audit issue created: ${issue.data.html_url}`);
