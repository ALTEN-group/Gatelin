<p-listbox 
  class="columns-listbox"
  [options]="activeView().columns" 
  [(ngModel)]="selectedColumnsKeys" 
  (onChange)="onChange()"
  (onDrop)="onDrop($event)"
  optionLabel="label" 
  optionValue="key"
  [optionDisabled]="isOptionDisabled"
  [dragdrop]="true" 
  [multiple]="true" 
  [checkbox]="true"
  [disabled]="isColumnsEditionDisabled()"
  dataKey="key"
/>
