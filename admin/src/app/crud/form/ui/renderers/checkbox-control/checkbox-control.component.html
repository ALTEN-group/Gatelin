<div class="checkbox-container p-inputtext p-component"
    [class.p-disabled]="isDisabled()">
    <p-checkbox 
        [formControl]="control()"
        [binary]="true"
        class="checkbox-input"
        [id]="config().key"
        (onChange)="emitInteractionEvent('valueChange')"
        (onBlur)="emitInteractionEvent('blur')"
        (onFocus)="emitInteractionEvent('focus')"
    />
</div>
