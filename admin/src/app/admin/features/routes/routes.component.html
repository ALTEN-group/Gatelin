    [httpCalls]="httpCalls"
    [entityFactory]="entityFactory"
    [entityId]="tableInformation.key"
    [entityLabel]="tableInformation.label"
    [tableTitle]="tableInformation.title"
    [editionDialogSize]="tableInformation.editionDialogSize"
    [customRowStyles]="rowStyles"
