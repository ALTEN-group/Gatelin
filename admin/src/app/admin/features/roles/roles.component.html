<tbl-table 
    [config]="config"
    [httpCalls]="httpCalls"
    [entityFactory]="entityFactory"
    [entityId]="tableInformation.key"
    [entityLabel]="tableInformation.label"
    [tableTitle]="tableInformation.title"
    [customRowStyles]="tableInformation.customRowStyles"
    (rowClicked)="onRoleClick($event)"
/>

@if (selectedRole()?.id) {
  <adm-permissions [roleId]="selectedRole()!.id!" />
}
