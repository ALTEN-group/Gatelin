<p-panel
  (mouseover)="sidenavService.setExpanded(true)"
  (mouseleave)="sidenavService.setExpanded(false)"
  (focusin)="sidenavService.setExpanded(true)"
  (focusout)="sidenavService.setExpanded(false)"
  [class.collapsed]="!sidenavService.getExpanded()">

  <ng-template pTemplate="header">
    <div [routerLink]="'/'" class="header">
      @if (!sidenavService.getExpanded()) {
        <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#10B981"/>
          <text x="9" y="31" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="36" fill="white" transform="rotate(-25, 22, 16)">G</text>
        </svg>
      } @else {
        <svg width="162" height="40" viewBox="0 0 162 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#10B981"/>
          <text x="9" y="31" font-family="Nunito, Arial, sans-serif" font-weight="900" font-size="36" fill="white" transform="rotate(-25, 22, 16)">G</text>
          <text x="44" y="32" font-family="Nunito, Arial, sans-serif" font-weight="800" font-size="34" fill="#10B981">atelin</text>
        </svg>
      }
    </div>
    <i class="pi pi-angle-double-{{sidenavService.getPinned() ? 'left' : 'right'}} toggle-icon"
      (click)="sidenavService.togglePinned()">
    </i>
  </ng-template>

    @if (sideNavItems()) {
      <p-panelMenu #panelMenu
        [model]="sideNavItems()"
        [multiple]="false"
        styleClass="sidenav"
        [style]="{'width':'100%'}"
      />
    }
</p-panel>
